trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  serviceConnection: AzureServiceConnection
  terraformWorkingDirectory: $(System.DefaultWorkingDirectory)
  backend_RG: rg-aks-demo
  backend_storage_account: sttswapnil123456
  backend_container_name: tfstate
  backend_key: terraform.tfstate

stages:
  - stage: TerraformPlan
    displayName: Terraform Plan
    jobs:
      - job: TerraformPlan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: latest

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: $(terraformWorkingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backend_RG)
              backendAzureRmStorageAccountName: $(backend_storage_account)
              backendAzureRmContainerName: $(backend_container_name)
              backendAzureRmKey: $(backend_key)

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: azurerm
              command: validate
              workingDirectory: $(terraformWorkingDirectory)

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: $(terraformWorkingDirectory)
              commandOptions: -out=tfplan
              environmentServiceNameAzureRM: $(serviceConnection)
            env:
              TF_VAR_admin_password: $(TF_VAR_admin_password)

          - publish: $(terraformWorkingDirectory)/tfplan
            artifact: terraform-plan

  - stage: TerraformApply
    displayName: Terraform Apply
    dependsOn: TerraformPlan
    condition: succeeded()
    jobs:
      - job: TerraformApply
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: latest

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: $(terraformWorkingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backend_RG)
              backendAzureRmStorageAccountName: $(backend_storage_account)
              backendAzureRmContainerName: $(backend_container_name)
              backendAzureRmKey: $(backend_key)

          - task: DownloadPipelineArtifact@2
            displayName: Download Terraform plan
            inputs:
              artifact: terraform-plan
              path: $(terraformWorkingDirectory)

          - task: TerraformTaskV4@4
            displayName: Apply reviewed Terraform plan
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: $(terraformWorkingDirectory)
              commandOptions: tfplan
              environmentServiceNameAzureRM: $(serviceConnection)
            env:
              TF_VAR_admin_password: $(TF_VAR_admin_password)